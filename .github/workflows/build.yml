name: Build Attendance APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project files
        run: |
          rm -rf attendance
          mkdir -p attendance/app/src/main/java/com/sosuke/attendance
          cd attendance

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Attendance"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.sosuke.attendance"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.sosuke.attendance"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Attendance" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sosuke/attendance/MainActivity.kt <<'EOF'
          package com.sosuke.attendance

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale

          class Subject(var name: String, var attended: Int, var total: Int, var last: String = "")

          object Store {
              private fun sp(c: Context) = c.getSharedPreferences("att", Context.MODE_PRIVATE)
              fun load(c: Context): MutableList<Subject> {
                  val out = mutableListOf<Subject>()
                  try {
                      val arr = JSONArray(sp(c).getString("subjects", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(Subject(o.getString("n"), o.getInt("a"), o.getInt("t"), o.optString("l", "")))
                      }
                  } catch (e: Exception) { }
                  return out
              }
              fun save(c: Context, list: List<Subject>) {
                  val arr = JSONArray()
                  for (s in list) {
                      val o = JSONObject()
                      o.put("n", s.name)
                      o.put("a", s.attended)
                      o.put("t", s.total)
                      o.put("l", s.last)
                      arr.put(o)
                  }
                  sp(c).edit().putString("subjects", arr.toString()).apply()
              }
          }

          class MainActivity : Activity() {
              private val BG = Color.BLACK
              private val CELL = Color.parseColor("#1C1C1E")
              private val SEP = Color.parseColor("#38383A")
              private val MUTED = Color.parseColor("#8E8E93")
              private val GREEN = Color.parseColor("#34C759")
              private val RED = Color.parseColor("#FF453A")
              private val ORANGE = Color.parseColor("#FF9F0A")
              private val BLUE = Color.parseColor("#0A84FF")

              // Overall attendance slabs: 95+ = 5 marks, 90+ = 4, 85+ = 3, 80+ = 2, 75+ = 1
              private val SLABS = intArrayOf(95, 90, 85, 80, 75)

              private lateinit var subjects: MutableList<Subject>
              private lateinit var sv: ScrollView

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun oval(color: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(color)
                  return g
              }

              private fun txt(t: String, size: Float, color: Int, bold: Boolean): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(v.typeface, Typeface.BOLD)
                  return v
              }

              private fun lpm(top: Int, bottom: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  p.topMargin = dp(top)
                  p.bottomMargin = dp(bottom)
                  return p
              }

              private fun card(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = rounded(CELL, 16)
                  c.setPadding(dp(16), dp(14), dp(16), dp(14))
                  return c
              }

              private fun fmt(v: Double): String = String.format(Locale.US, "%.1f%%", v)

              private fun pct(a: Int, t: Int): Double = if (t == 0) 100.0 else a * 100.0 / t

              private fun marksFor(a: Int, t: Int): Int {
                  if (t == 0) return 0
                  for (i in SLABS.indices) if (100 * a >= SLABS[i] * t) return 5 - i
                  return 0
              }

              private fun colorFor(a: Int, t: Int): Int {
                  if (t == 0) return MUTED
                  val k = marksFor(a, t)
                  return if (k == 0) RED else if (k == 1) ORANGE else GREEN
              }

              private fun canSkip(a: Int, t: Int, th: Int): Int {
                  val v = 100 * a - th * t
                  return if (v < 0) 0 else v / th
              }

              private fun mustAttend(a: Int, t: Int, th: Int): Int {
                  val need = th * t - 100 * a
                  return if (need <= 0) 0 else (need + (100 - th) - 1) / (100 - th)
              }

              private fun plural(n: Int): String = if (n == 1) "class" else "classes"

              private fun markWord(n: Int): String = if (n == 1) "mark" else "marks"

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun commit() {
                  Store.save(this, subjects)
                  render()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  subjects = Store.load(this)
                  sv = ScrollView(this)
                  sv.setBackgroundColor(BG)
                  setContentView(sv)
                  render()
              }

              private fun button(label: String, color: Int, onClick: () -> Unit): TextView {
                  val v = txt(label, 14f, color, true)
                  v.gravity = Gravity.CENTER
                  v.background = rounded(Color.argb(0x2E, Color.red(color), Color.green(color), Color.blue(color)), 12)
                  v.setOnClickListener { onClick() }
                  return v
              }

              private fun render() {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(56), dp(16), dp(40))

                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(txt("Attendance", 34f, Color.WHITE, true),
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val plus = txt("+", 26f, Color.WHITE, false)
                  plus.gravity = Gravity.CENTER
                  plus.background = oval(BLUE)
                  plus.setOnClickListener { editDialog(null) }
                  head.addView(plus, LinearLayout.LayoutParams(dp(40), dp(40)))
                  root.addView(head, lpm(0, 18))

                  var totA = 0
                  var totT = 0
                  for (s in subjects) { totA += s.attended; totT += s.total }
                  val marks = marksFor(totA, totT)
                  val oc = colorFor(totA, totT)

                  val sc = card()
                  sc.addView(txt("OVERALL", 12f, MUTED, false))
                  sc.addView(txt(if (totT == 0) "--" else fmt(pct(totA, totT)), 44f, oc, true))
                  sc.addView(txt("$totA of $totT classes attended", 14f, MUTED, false))
                  val mk = txt("Attendance marks: $marks / 5", 17f, Color.WHITE, true)
                  mk.setPadding(0, dp(12), 0, 0)
                  sc.addView(mk)

                  val line1 = when {
                      totT == 0 -> "Mark your first class to get started"
                      marks == 0 -> {
                          val n = mustAttend(totA, totT, 75)
                          "Below 75%. Attend the next $n ${plural(n)} in a row to get back to 75%"
                      }
                      else -> {
                          val sk = canSkip(totA, totT, SLABS[5 - marks])
                          if (sk == 0) "At the limit for $marks ${markWord(marks)}. Don't miss the next class"
                          else "You can skip $sk ${plural(sk)} and still keep $marks ${markWord(marks)}"
                      }
                  }
                  val l1 = txt(line1, 15f, oc, false)
                  l1.setPadding(0, dp(4), 0, 0)
                  sc.addView(l1)

                  if (totT > 0 && marks >= 1) {
                      val line2 = if (marks == 5) "Full marks! Stay at 95% or above"
                      else {
                          val th2 = SLABS[4 - marks]
                          val n2 = mustAttend(totA, totT, th2)
                          "Attend the next $n2 ${plural(n2)} in a row for ${marks + 1} marks ($th2% or more)"
                      }
                      val l2 = txt(line2, 14f, MUTED, false)
                      l2.setPadding(0, dp(6), 0, 0)
                      sc.addView(l2)
                  }
                  root.addView(sc, lpm(0, 18))

                  if (subjects.isEmpty()) {
                      val e = card()
                      e.addView(txt("No subjects yet", 17f, Color.WHITE, true))
                      e.addView(txt("Tap + at the top and add your subjects. Then tap Yes or No after each class.", 14f, MUTED, false))
                      root.addView(e, lpm(0, 0))
                  }

                  for (s in subjects) {
                      val col = colorFor(s.attended, s.total)
                      val c = card()
                      val top = LinearLayout(this)
                      top.gravity = Gravity.CENTER_VERTICAL
                      top.addView(txt(s.name, 19f, Color.WHITE, true),
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      top.addView(txt(if (s.total == 0) "--" else fmt(pct(s.attended, s.total)), 22f, col, true))
                      top.setOnClickListener { editDialog(s) }
                      c.addView(top)
                      c.addView(txt("${s.attended} of ${s.total} classes", 14f, MUTED, false))

                      val bar = LinearLayout(this)
                      bar.weightSum = 100f
                      bar.background = rounded(SEP, 3)
                      val fillW = pct(s.attended, s.total).toFloat().coerceIn(0f, 100f)
                      val fill = View(this)
                      fill.background = rounded(col, 3)
                      bar.addView(fill, LinearLayout.LayoutParams(0, dp(6), fillW))
                      val bp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(6))
                      bp.topMargin = dp(12)
                      bp.bottomMargin = dp(14)
                      c.addView(bar, bp)

                      val btns = LinearLayout(this)
                      val yes = button("Yes, attended", GREEN) {
                          s.attended++
                          s.total++
                          s.last = "p"
                          commit()
                      }
                      val no = button("No, missed", RED) {
                          s.total++
                          s.last = "a"
                          commit()
                      }
                      val undo = button("Undo", MUTED) {
                          if (s.last == "p" && s.attended > 0 && s.total > 0) { s.attended--; s.total-- }
                          else if (s.last == "a" && s.total > 0) s.total--
                          s.last = ""
                          commit()
                      }
                      val w1 = LinearLayout.LayoutParams(0, dp(46), 1f)
                      w1.setMargins(0, 0, dp(6), 0)
                      val w2 = LinearLayout.LayoutParams(0, dp(46), 1f)
                      w2.setMargins(0, 0, dp(6), 0)
                      val w3 = LinearLayout.LayoutParams(0, dp(46), 0.6f)
                      btns.addView(yes, w1)
                      btns.addView(no, w2)
                      btns.addView(undo, w3)
                      c.addView(btns)
                      root.addView(c, lpm(0, 12))
                  }

                  val y = sv.scrollY
                  sv.removeAllViews()
                  sv.addView(root)
                  sv.post { sv.scrollTo(0, y) }
              }

              private fun field(hint: String, value: String, number: Boolean): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setText(value)
                  e.inputType = if (number) InputType.TYPE_CLASS_NUMBER
                      else InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_WORDS
                  return e
              }

              private fun editDialog(s: Subject?) {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(20), dp(8), dp(20), 0)
                  val n = field("Subject name", s?.name ?: "", false)
                  box.addView(n)
                  var a: EditText? = null
                  var t: EditText? = null
                  if (s != null) {
                      a = field("Classes attended so far", s.attended.toString(), true)
                      t = field("Total classes held so far", s.total.toString(), true)
                      box.addView(a)
                      box.addView(t)
                  }
                  val b = AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(if (s == null) "Add subject" else "Edit subject")
                      .setView(box)
                      .setPositiveButton("Save") { _, _ ->
                          val name = n.text.toString().trim()
                          val attV = a?.text?.toString()?.toIntOrNull() ?: 0
                          val totV = t?.text?.toString()?.toIntOrNull() ?: 0
                          if (name.isEmpty()) toast("Enter a subject name")
                          else if (attV > totV) toast("Attended can't be more than total")
                          else {
                              if (s == null) subjects.add(Subject(name, 0, 0))
                              else {
                                  s.name = name
                                  s.attended = attV
                                  s.total = totV
                                  s.last = ""
                              }
                              commit()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                  if (s != null) b.setNeutralButton("Delete") { _, _ ->
                      subjects.remove(s)
                      commit()
                  }
                  b.show()
              }
          }
          EOF
      - name: Build APK
        run: |
          cd attendance
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Attendance-apk
          path: attendance/app/build/outputs/apk/debug/app-debug.apk
